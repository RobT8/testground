<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lane Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: white; }
  canvas { border: 2px solid #444; display: block; outline: none; }
  #controls { display: flex; gap: 10px; padding: 10px 0; }
  .btn { background: #333; border: 2px solid #666; color: white; padding: 12px 24px; font-size: 16px; font-family: monospace; cursor: pointer; border-radius: 4px; user-select: none; touch-action: none; }
  .btn:active, .btn.pressed { background: #555; border-color: #aaa; }
  #overlay { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(0,0,0,0.75); width: 100%; height: 100%; }
  #msg { font-size: 28px; font-weight: bold; text-align: center; }
  #submsg { font-size: 13px; color: #aaa; text-align: center; line-height: 1.8; }
  #start-btn { background: #333; border: 2px solid #666; color: white; padding: 12px 32px; font-size: 18px; font-family: monospace; cursor: pointer; border-radius: 4px; }
  #start-btn:hover { background: #555; }
</style>
</head>
<body>
<div style="position:relative">
  <canvas id="c" width="360" height="520" tabindex="0"></canvas>
  <div id="overlay">
    <div id="msg">LANE RACER</div>
    <div id="submsg">Start in 100th. Win by reaching 1st after 10 laps.<br><br>◀ ▶ arrows — change lane<br>CTRL — accelerate (release to slow)<br><br>Hit a car = lose a life (3 lives)<br>Hit a wall = slowed for 5 seconds</div>
    <button id="start-btn">START RACE</button>
  </div>
</div>
<div id="controls">
  <button class="btn" id="btn-left">◀ LEFT</button>
  <button class="btn" id="btn-accel">▲ ACCEL</button>
  <button class="btn" id="btn-right">RIGHT ▶</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LANE_X = [60, 180, 300];
const PLAYER_Y = 420;
const TOTAL_LAPS = 10;
const TRACK_LENGTH = 3000;
const MAX_SPEED = 420;

let state = 'menu';
let playerLane, playerSpeed, playerPos, lap, roadOffset, stripeOffset;
let playerRacePos, lives, wallPenalty, crashFlash, lastLaneChange;
let cars = [];

const keys = { left: false, right: false, accel: false };
let lastTime = 0;

function initRace() {
  playerLane = 1;
  playerSpeed = 0;
  playerPos = 0;
  lap = 1;
  roadOffset = 0;
  stripeOffset = 0;
  playerRacePos = 100;
  lives = 3;
  wallPenalty = 0;   // seconds remaining of wall slow
  crashFlash = 0;    // seconds remaining of red flash
  lastLaneChange = 0;

  cars = [];
  for (let i = 0; i < 99; i++) {
    const rank = i + 1; // 1=leader(fast,far), 99=tail(slow,near)
    const aheadFraction = rank / 99;
    const trackPos = aheadFraction * TRACK_LENGTH * TOTAL_LAPS * 0.88;
    // Leaders much faster - harder to catch
    const speed = 55 + ((99 - rank) / 99) * 130; // rank99=55, rank1=185
    cars.push({
      rank,
      lane: Math.floor(Math.random() * 3),
      trackPos,
      speed,
      color: carColor(rank),
    });
  }
}

function carColor(rank) {
  const hue = (rank * 137.5) % 360;
  return `hsl(${hue}, 80%, 55%)`;
}

function update(dt) {
  if (state !== 'racing') return;

  const wallSlowed = wallPenalty > 0;
  if (wallPenalty > 0) wallPenalty = Math.max(0, wallPenalty - dt);
  if (crashFlash > 0) crashFlash = Math.max(0, crashFlash - dt);

  // Acceleration
  const ACCEL = 220;
  const DECEL = 160;
  const speedCap = wallSlowed ? MAX_SPEED * 0.3 : MAX_SPEED;
  if (keys.accel) {
    playerSpeed = Math.min(speedCap, playerSpeed + ACCEL * dt);
  } else {
    playerSpeed = Math.max(0, playerSpeed - DECEL * dt);
  }
  if (wallSlowed) playerSpeed = Math.min(playerSpeed, speedCap);

  // Lane change
  const now = performance.now();
  if (now - lastLaneChange > 280) {
    if (keys.left && playerLane > 0) { playerLane--; lastLaneChange = now; }
    else if (keys.right && playerLane < 2) { playerLane++; lastLaneChange = now; }
  }

  // Wall collision: if player tries to go beyond lane 0 or lane 2 edges
  // Actually enforce: if key held against wall, apply wall penalty
  if ((keys.left && playerLane === 0) || (keys.right && playerLane === 2)) {
    if (playerSpeed > 80 && wallPenalty === 0 && now - lastLaneChange < 50) {
      wallPenalty = 5;
      playerSpeed *= 0.3;
    }
  }

  const dist = playerSpeed * dt;
  playerPos += dist;
  roadOffset += dist;
  stripeOffset = (stripeOffset + dist) % 80;

  lap = Math.floor(playerPos / TRACK_LENGTH) + 1;
  if (lap > TOTAL_LAPS) {
    state = playerRacePos === 1 ? 'win' : 'lose';
    showEndScreen();
    return;
  }

  // Recalculate race position
  let pos = 1;
  for (const car of cars) { if (car.trackPos > playerPos) pos++; }
  playerRacePos = pos;

  // Car collision: same lane, car just ahead (within 55 units), player faster
  for (const car of cars) {
    const diff = car.trackPos - playerPos;
    if (diff > 0 && diff < 55 && car.lane === playerLane) {
      if (playerSpeed > car.speed + 20) {
        // Crash!
        lives--;
        crashFlash = 1.2;
        playerSpeed = 0;
        // Bounce player back slightly
        playerPos -= 60;
        if (lives <= 0) {
          state = 'lose';
          showEndScreen();
          return;
        }
        break;
      } else {
        // Just blocked
        playerSpeed = Math.min(playerSpeed, car.speed * 0.95);
      }
    }
  }
}

function draw() {
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, 0, W, H);

  // Road
  ctx.fillStyle = '#484848';
  ctx.fillRect(20, 0, W - 40, H);

  // Kerb stripes on edges
  for (let y = -80; y < H; y += 40) {
    const sy = (y + stripeOffset * 0.5) % (H + 80) - 80;
    ctx.fillStyle = (Math.floor(sy / 20) % 2 === 0) ? '#cc2222' : '#eeeeee';
    ctx.fillRect(20, sy, 8, 20);
    ctx.fillRect(W - 28, sy, 8, 20);
  }

  // Lane dividers dashed
  ctx.strokeStyle = '#fff6';
  ctx.lineWidth = 2;
  ctx.setLineDash([40, 40]);
  ctx.lineDashOffset = -stripeOffset;
  for (const x of [120, 240]) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Other cars
  const VIEW_RANGE = 620;
  // Sort by relPos descending so farther cars drawn first
  const visible = cars
    .map(c => ({ car: c, rel: c.trackPos - playerPos }))
    .filter(({ rel }) => rel > -60 && rel < VIEW_RANGE)
    .sort((a, b) => b.rel - a.rel);

  for (const { car, rel } of visible) {
    const y = PLAYER_Y - (rel / VIEW_RANGE) * (PLAYER_Y - 60);
    const scale = 0.35 + 0.65 * (1 - rel / VIEW_RANGE);
    drawCar(LANE_X[car.lane], y, scale, car.color, false);
  }

  // Wall penalty effect - orange tint edges
  if (wallPenalty > 0) {
    ctx.fillStyle = `rgba(255,140,0,${Math.min(0.35, wallPenalty * 0.08)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Player car (flash red on crash)
  const playerColor = crashFlash > 0 && Math.floor(crashFlash * 8) % 2 === 0 ? '#ff2222' : '#00cfff';
  drawCar(LANE_X[playerLane], PLAYER_Y, 1.0, playerColor, true);

  // Top fade
  const grad = ctx.createLinearGradient(0, 0, 0, 70);
  grad.addColorStop(0, '#2a2a2a');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 70);

  // HUD
  drawHUD();
}

function drawHUD() {
  // Background bar
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, 44);

  ctx.font = 'bold 13px monospace';
  ctx.textBaseline = 'middle';

  // Lives (hearts)
  ctx.fillStyle = '#ff4466';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#ff4466' : '#444';
    ctx.font = '18px monospace';
    ctx.fillText('♥', 10 + i * 24, 22);
  }

  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.fillText(`LAP ${Math.min(lap, TOTAL_LAPS)} / ${TOTAL_LAPS}`, W / 2, 15);

  const posColor = playerRacePos <= 3 ? '#ffd700' : playerRacePos <= 10 ? '#88ff88' : '#ffffff';
  ctx.fillStyle = posColor;
  ctx.fillText(`POS ${playerRacePos}`, W / 2, 31);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText(`${Math.round(playerSpeed)} km/h`, W - 8, 15);

  if (wallPenalty > 0) {
    ctx.fillStyle = '#ff8800';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`WALL! ${wallPenalty.toFixed(1)}s`, W - 8, 31);
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawCar(cx, cy, scale, color, isPlayer) {
  const cw = 36 * scale, ch = 60 * scale;
  const x = cx - cw / 2, y = cy - ch / 2;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, cw, ch, 6 * scale);
  ctx.fill();

  ctx.fillStyle = isPlayer ? '#001a33' : '#33444488';
  ctx.fillRect(x + cw * 0.15, y + ch * 0.15, cw * 0.7, ch * 0.25);

  ctx.fillStyle = '#111';
  const ww = 7 * scale, wh = 12 * scale;
  ctx.fillRect(x - ww * 0.6, y + ch * 0.1, ww, wh);
  ctx.fillRect(x + cw - ww * 0.4, y + ch * 0.1, ww, wh);
  ctx.fillRect(x - ww * 0.6, y + ch * 0.65, ww, wh);
  ctx.fillRect(x + cw - ww * 0.4, y + ch * 0.65, ww, wh);

  if (isPlayer) {
    ctx.fillStyle = '#ffffaa';
    ctx.fillRect(x + cw * 0.1, y + ch * 0.85, cw * 0.25, ch * 0.08);
    ctx.fillRect(x + cw * 0.65, y + ch * 0.85, cw * 0.25, ch * 0.08);
  }
}

function showEndScreen() {
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const submsg = document.getElementById('submsg');
  const btn = document.getElementById('start-btn');
  overlay.style.display = 'flex';
  if (state === 'win') {
    msg.innerHTML = '&#127942; YOU WIN!';
    submsg.textContent = 'You reached 1st place after 10 laps!';
  } else if (lives <= 0) {
    msg.textContent = 'CRASHED OUT!';
    submsg.textContent = `You ran out of lives in position ${playerRacePos}.`;
  } else {
    msg.textContent = 'RACE OVER';
    submsg.textContent = `You finished in position ${playerRacePos}.\nBetter luck next time!`;
  }
  btn.textContent = 'RACE AGAIN';
}

// Engine audio
let audioCtx = null, engineOsc = null, engineGain = null, noiseSource = null, noiseGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  engineOsc = audioCtx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 80;
  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0;

  const bufferSize = audioCtx.sampleRate * 2;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  noiseSource.loop = true;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 300;

  noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0;

  engineOsc.connect(engineGain).connect(audioCtx.destination);
  noiseSource.connect(filter).connect(noiseGain).connect(audioCtx.destination);
  engineOsc.start();
  noiseSource.start();
}

function updateEngineSound() {
  if (!audioCtx || state !== 'racing') return;
  const t = audioCtx.currentTime;
  const speedFrac = playerSpeed / MAX_SPEED;
  engineOsc.frequency.setTargetAtTime(80 + speedFrac * 220, t, 0.1);
  if (keys.accel && playerSpeed > 5) {
    engineGain.gain.setTargetAtTime(0.08, t, 0.05);
    noiseGain.gain.setTargetAtTime(0.04 + speedFrac * 0.06, t, 0.05);
  } else {
    engineGain.gain.setTargetAtTime(playerSpeed > 5 ? 0.03 : 0, t, 0.15);
    noiseGain.gain.setTargetAtTime(playerSpeed > 5 ? 0.015 : 0, t, 0.15);
  }
}

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  update(dt);
  updateEngineSound();
  draw();
  requestAnimationFrame(gameLoop);
}

function setupControls() {
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; e.preventDefault(); }
    if (e.key === 'Control') { keys.accel = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'Control') keys.accel = false;
  });

  function addBtn(id, key) {
    const el = document.getElementById(id);
    let pointerId = null;
    el.addEventListener('pointerdown', e => {
      pointerId = e.pointerId;
      el.setPointerCapture(e.pointerId);
      keys[key] = true; el.classList.add('pressed'); e.preventDefault();
    });
    el.addEventListener('pointerup', e => {
      if (e.pointerId === pointerId) { keys[key] = false; el.classList.remove('pressed'); pointerId = null; }
    });
    el.addEventListener('pointercancel', e => {
      if (e.pointerId === pointerId) { keys[key] = false; el.classList.remove('pressed'); pointerId = null; }
    });
  }
  addBtn('btn-left', 'left');
  addBtn('btn-right', 'right');
  addBtn('btn-accel', 'accel');

  document.getElementById('start-btn').addEventListener('click', () => {
    initAudio();
    initRace();
    state = 'racing';
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('start-btn').blur();
    canvas.focus();
  });
}

setupControls();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
