plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nightalert.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nightalert.app"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
            // Debug APK is unsigned-for-store but installable via "unknown sources".
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Firebase Cloud Messaging (for guaranteed instant wake even in deep Doze).
    // Harmless until google-services.json is added — Firebase just won't init.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}

// Only wire up Firebase once you've added the config file from the Firebase
// console. Until then the build works exactly as before, without push.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
