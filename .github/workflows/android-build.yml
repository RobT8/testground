name: Build Android APK

# Builds the installable app in the cloud so you don't need Android Studio.
# After it runs, download "night-alert-apk" from the run's Artifacts section.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allows publishing the APK to a Release
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: night-alert-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish to a Release so the APK has a direct, phone-friendly download link:
      #   https://github.com/RobT8/testground/releases/download/apk-latest/app-debug.apk
      - name: Publish APK to Release
        if: github.ref == 'refs/heads/claude/diabetes-alert-app-m01v2y'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Night Alert — latest APK
          body: "Latest build of the Night Alert app. Tap app-debug.apk below to install."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: "true"
