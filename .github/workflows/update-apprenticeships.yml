name: Refresh apprenticeship listings

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC - free on GitHub Actions
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apprenticeship-board
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest vacancies
        env:
          APPRENTICESHIP_API_KEY: ${{ secrets.APPRENTICESHIP_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vacancies.json
          git diff --cached --quiet || git commit -m "chore: refresh apprenticeship listings"
          git push
